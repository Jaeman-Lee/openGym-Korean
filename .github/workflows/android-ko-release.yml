name: Android Korean release

on:
  push:
    tags:
      - 'v*-ko.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: android-ko-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_NAME: openGym-ko-v1.2.9-ko.1.apk

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        working-directory: frontend

      - name: Test Korean app
        run: |
          npm test
          node scripts/check-locales.mjs
        working-directory: frontend

      - name: Build mobile web assets
        run: npm run build:mobile
        working-directory: frontend

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opengym-ko-release.jks"

      - name: Build signed APK
        env:
          OPENGYM_KEYSTORE_PATH: ${{ runner.temp }}/opengym-ko-release.jks
          OPENGYM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          OPENGYM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OPENGYM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android

      - name: Verify and stage APK
        run: |
          APK_SOURCE=frontend/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -f "$APK_SOURCE"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_SOURCE"
          mkdir -p release
          install -m 0644 "$APK_SOURCE" "release/$APK_NAME"
          cd release
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --verify-tag
          --title "openGym 한국어판 1.2.9-ko.1"
          --notes-file docs/RELEASE_NOTES_KO.md
